name: template_monorepo
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

workspace:
  - apps
  - packages/core/database_service
  - packages/core/di_service
  - packages/core/logger_service
  - packages/core/route_service
  - packages/core/theme_service
  - packages/utilities/encrypt_utils
  - packages/utilities/shared


dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  melos: ^7.3.0

melos:
  command:
    bootstrap:
      dependencies:
        get_it: ^8.2.0
        injectable: ^2.5.1
        equatable: ^2.0.7
        flutter_bloc: ^9.1.1
        go_router: ^16.2.0
        flutter_screenutil: ^5.9.3
        dio: ^5.9.0
        freezed_annotation: ^3.1.0
        json_annotation: ^4.9.0
      dev_dependencies:
        build_runner: ^2.7.0
        injectable_generator: ^2.8.1
        freezed: ^3.2.0
        json_serializable: ^6.11.0
        flutter_launcher_icons: ^0.14.2

  scripts:
    analyze:
      name: Analyze Code
      run: dart analyze .
      exec:
        concurrency: 20
        failFast: true
        orderDependents: true
    gen:packages:
      name: Generate Packages
      description: Generate code for packages
      run: dart run build_runner build --delete-conflicting-outputs
      exec:
        concurrency: 8
        failFast: true
        orderDependents: true
      packageFilters:
        dependsOn: build_runner
    launcher:staging:
      name: Generate Icon Launcher Staging
      description: Generate icon launcher
      run: dart run flutter_launcher_icons -f flutter_launcher_icons_staging.yaml
      exec:
        concurrency: 8
        failFast: true
        orderDependents: true
      packageFilters:
        dependsOn: flutter_launcher_icons
    launcher:production:
      name: Generate Icon Launcher Production
      description: Generate icon launcher
      run: dart run flutter_launcher_icons -f flutter_launcher_icons_production.yaml
      exec:
        concurrency: 8
        failFast: true
        orderDependents: true
      packageFilters:
        dependsOn: flutter_launcher_icons
    rename:staging:
      name: Rename Package to Staging
      description: Rename the package for staging environment
      run: dart run package_rename -p "apps/package_rename_config.yaml" -f staging
      packageFilters:
        dependsOn: package_rename
    rename:production:
      name: Rename Package to Production
      description: Rename the package for production environment
      run: dart run package_rename -p "apps/package_rename_config.yaml" -f production
      packageFilters:
        dependsOn: package_rename

